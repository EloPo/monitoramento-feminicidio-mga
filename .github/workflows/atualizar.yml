name: Atualizar monitor

on:
  schedule:
        - cron: "7 3 * * *"    # todos os dias à 0h07 de Brasília (3h07 UTC)
  workflow_dispatch:        # botão "Run workflow" para rodar na hora

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Coletar e atualizar
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python atualizar.py
      - name: Salvar no repositório (publica o site)
        run: |
          git config user.name "monitor-bot"
          git config user.email "monitor-bot@users.noreply.github.com"
          git add dados docs
          git diff --cached --quiet || git commit -m "Coleta automática $(date +%Y-%m-%d)"
          git push
      - name: Mostrar relatório
        run: cat dados/ultimo_relatorio.md >> "$GITHUB_STEP_SUMMARY"
